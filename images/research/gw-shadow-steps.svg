<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img"
     aria-label="Bregman splitting geometry: the run alternates between the row-feasible set R and the column-feasible set S, which intersect at T; each plan projects along a dashed fiber to its shadow on T.">
<style>
  :root { --ink:#333333; --mut:#5a5a5a; --tee:#b0b0b0; --dot:#1a1a1a; --bg:#ffffff; }
  
  text { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: var(--ink); }
  .sm { font-size: 15px; }
  .set { font-size: 17px; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,4 L0,8 z" fill="var(--mut)"/>
  </marker>
  <marker id="ahT" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,4 L0,8 z" fill="var(--ink)"/>
  </marker>
</defs>

<rect x="0" y="0" width="360" height="260" rx="6" fill="#ffffff"/>
<!-- feasible-set wedges -->
<path d="M40,130 L280,130 L352,28 L112,28 Z"  fill="#4a7ebb" fill-opacity="0.13"/>
<path d="M40,130 L280,130 L352,232 L112,232 Z" fill="#e08a2e" fill-opacity="0.15"/>
<path d="M40,130 L112,28 L352,28 L280,130"   fill="none" stroke="#4a7ebb" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M40,130 L112,232 L352,232 L280,130" fill="none" stroke="#d1812f" stroke-opacity="0.55" stroke-width="1.2"/>

<!-- the intersection T -->
<line x1="40" y1="130" x2="280" y2="130" stroke="var(--tee)" stroke-width="4.5" stroke-linecap="round"/>

<!-- fibers of diagonal scalings -->
<path d="M148,64  C133,85 118,109 112,130" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
<path d="M136,190 C118,172 109,148 112,130" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
<path d="M262,70  C244,88 226,112 214,130" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>

<!-- shadow step along T -->
<line x1="120" y1="130" x2="205" y2="130" stroke="var(--ink)" stroke-width="2.6" marker-end="url(#ahT)"/>

<!-- the run -->
<line x1="147.4" y1="70"    x2="136.8" y2="181" stroke="var(--mut)" stroke-width="1.7" marker-end="url(#ah)"/>
<line x1="140.3" y1="185.9" x2="256"   y2="76"  stroke="var(--mut)" stroke-width="1.7" marker-end="url(#ah)"/>

<!-- plans -->
<circle cx="148" cy="64"  r="4.2" fill="var(--dot)"/>
<circle cx="136" cy="190" r="4.2" fill="var(--dot)"/>
<circle cx="262" cy="70"  r="4.2" fill="var(--dot)"/>
<!-- shadows -->
<circle cx="112" cy="130" r="4.6" fill="var(--bg)" stroke="var(--dot)" stroke-width="1.8"/>
<circle cx="214" cy="130" r="4.6" fill="var(--bg)" stroke="var(--dot)" stroke-width="1.8"/>

<!-- labels -->
<text class="sm" x="148" y="52"  text-anchor="middle">Y<tspan font-size="11" dy="-5">k</tspan></text>
<text class="sm" x="136" y="210" text-anchor="middle">X<tspan font-size="11" dy="-5">k</tspan></text>
<text class="sm" x="262" y="58"  text-anchor="middle">Y<tspan font-size="11" dy="-5">k+1</tspan></text>
<text class="sm" x="104" y="151" text-anchor="end">T<tspan font-size="11" dy="-5">k</tspan></text>
<text class="sm" x="224" y="151" text-anchor="start">T<tspan font-size="11" dy="-5">k+1</tspan></text>
<text class="set" x="34"  y="135" text-anchor="end">T</text>
<text class="set" x="322" y="47"  text-anchor="middle">R</text>
<text class="set" x="322" y="215" text-anchor="middle">S</text>
</svg>
